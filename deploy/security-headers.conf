# Included by every location: nginx drops server-level add_header directives in any location that
# declares its own, so the security headers live here once and are repeated by inclusion.
#
# CSP: the SPA ships no inline script or style (React style props go through CSSOM; /config.js is a
# same-origin file), fonts come from Google Fonts, external images only from GitHub's avatar CDN (the
# signed-in user's picture), and the browser talks only to the three API origins that
# deploy/40-pipesor-config.sh substitutes for __PIPESOR_CONNECT_SRC__ at container startup.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://avatars.githubusercontent.com; connect-src 'self' __PIPESOR_CONNECT_SRC__; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
# /auth/complete arrives with a one-time handoff in its query; never leak it in a Referer.
add_header Referrer-Policy "no-referrer" always;
add_header X-Frame-Options "DENY" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
