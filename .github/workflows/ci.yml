name: CI

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    uses: pipesor-org/pipesor-ci/.github/workflows/service-ci.yml@43c70cde7f1eac01361032a69facdeb24107197c # v1.1.0
    permissions:
      contents: read
      packages: write
    with:
      verify-command: bun install --frozen-lockfile && bun run typecheck && bun run test && bun run lint && bun run build
      image-check-command: bash tests/check-image.sh "$IMAGE"
