name: Quality

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install standalone Lefthook
        env:
          LEFTHOOK_VERSION: 2.2.2
        run: |
          mkdir -p "$RUNNER_TEMP/lefthook" "$RUNNER_TEMP/bin"
          cd "$RUNNER_TEMP/lefthook"
          asset="lefthook_${LEFTHOOK_VERSION}_Linux_x86_64"
          curl -fsSLO "https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/${asset}"
          curl -fsSLO "https://github.com/evilmartians/lefthook/releases/download/v${LEFTHOOK_VERSION}/lefthook_checksums.txt"
          grep " ${asset}$" lefthook_checksums.txt | sha256sum --check -
          install -m 755 "$asset" "$RUNNER_TEMP/bin/lefthook"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run test:hooks
      - name: Validate pull request squash message
        if: github.event_name == 'pull_request'
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          printf '%s\n' "$PR_TITLE" | bun run commitlint
          printf '%s\n\n%s\n' "$PR_TITLE" "$PR_BODY" | bun run commitlint
      - name: Validate pull request commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: bun run commitlint --from "$BASE_SHA" --to "$HEAD_SHA"
      - name: Validate latest main commit
        if: github.event_name == 'push'
        run: bun run commitlint --last
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run build
      - name: Store verified frontend build
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 90

  image:
    # Dashboard container for the DEV environment (pipesor-iac workloads module): the SPA is rebuilt with the
    # environment's public API origins, packaged in unprivileged nginx and, on main, handed to the shared publication.
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_PIPESOR_INGESTION_URL: https://ingestion.bravepond-f9f279f5.westus3.azurecontainerapps.io
      VITE_PIPESOR_PIPELINE_URL: https://pipeline.bravepond-f9f279f5.westus3.azurecontainerapps.io
      VITE_PIPESOR_RECOMMENDATION_URL: https://recommendation.bravepond-f9f279f5.westus3.azurecontainerapps.io
      # Fail the bundle build instead of producing an image that cannot start.
      PIPESOR_REQUIRE_API_ORIGINS: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Build and check the dashboard image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}:sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          connect_src="$VITE_PIPESOR_INGESTION_URL $VITE_PIPESOR_PIPELINE_URL $VITE_PIPESOR_RECOMMENDATION_URL"
          docker build --platform linux/amd64 --build-arg "VCS_REF=$GITHUB_SHA" \
            --build-arg "PIPESOR_CONNECT_SRC=$connect_src" --tag "$image" .
          test "$(docker image inspect "$image" --format '{{.Config.User}}')" = "101:101"
          test "$(docker image inspect "$image" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          container="$(docker run --detach --publish 18080:8080 "$image")"
          trap 'docker rm --force "$container" >/dev/null 2>&1 || true' EXIT
          for _ in {1..20}; do curl -fsS http://127.0.0.1:18080/ >/dev/null 2>&1 && break; sleep 1; done
          curl -fsS http://127.0.0.1:18080/ | grep -q '<div id="root">'
          # Client-side routes fall back to the SPA shell with 200.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:18080/incidents/00000000-0000-0000-0000-000000000000)" = 200
          test "$(curl -sI http://127.0.0.1:18080/ | tr -d '\r' | grep -i '^cache-control:')" = "Cache-Control: no-store"
          # Security headers on the shell and on hashed assets; the CSP allows exactly the baked API origins.
          shell_headers="$(curl -sI http://127.0.0.1:18080/ | tr -d '\r')"
          asset="$(curl -fsS http://127.0.0.1:18080/ | grep -o '/assets/[^"]*\.js' | head -n1)"
          asset_headers="$(curl -sI "http://127.0.0.1:18080${asset}" | tr -d '\r')"
          for headers in "$shell_headers" "$asset_headers"; do
            grep -qi "^content-security-policy:.*connect-src 'self' ${connect_src};" <<<"$headers"
            grep -qi '^strict-transport-security: max-age=' <<<"$headers"
            grep -qi '^referrer-policy: no-referrer' <<<"$headers"
            grep -qi '^x-frame-options: DENY' <<<"$headers"
            grep -qi '^x-content-type-options: nosniff' <<<"$headers"
          done
          test "$(grep -ci '^content-security-policy:' <<<"$shell_headers")" = 1
          echo "IMAGE=$image" >> "$GITHUB_ENV"
      - name: Save the tested image for publication
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker save --output service-image.tar "$IMAGE"
          sha256sum service-image.tar > service-image.tar.sha256
      - name: Transfer the exact tested image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: image-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            service-image.tar
            service-image.tar.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: image
    uses: pipesor-org/pipesor-workspace/.github/workflows/publish-container.yml@c11b183f5248b708794192e6d6ce4d781ef340f5 # shared CI v1
    permissions:
      contents: read
      packages: write
